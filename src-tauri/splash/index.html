<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFC Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f8f7;color:#242424;font-family:'Segoe UI','Microsoft YaHei',sans-serif;display:grid;place-items:center;height:100vh}.card{width:520px;max-width:90vw;padding:48px;background:white;border:1px solid #e8e8e5;border-radius:20px;box-shadow:0 15px 70px #26365609}.logo{width:48px;height:48px;display:grid;place-items:center;background:#242424;color:white;font-size:30px;font-weight:700;border-radius:13px}h1{font-size:24px;margin:24px 0 10px}p{font-size:13px;line-height:1.8;color:#777773;white-space:pre-wrap;overflow-wrap:anywhere}.dots{width:80px;height:3px;border-radius:8px;background:#e8e8e5;margin-top:25px;overflow:hidden}.dots:before{content:'';display:block;height:100%;width:40%;background:#242424;animation:move 1.5s infinite}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(350%)}}@media(prefers-color-scheme:dark){body{background:#181818;color:#e8e8e5}.card{background:#202020;border-color:#383838}.logo{background:#e8e8e5;color:#202020}p{color:#9b9b96}.dots{background:#383838}.dots:before{background:#e8e8e5}}@media(prefers-reduced-motion:reduce){.dots:before{animation:none}}</style></head><body><section class="card"><div class="logo">R</div><h1 id="title">正在启动 RFC Studio</h1><p id="status">正在准备本地审核引擎，请稍候…</p><div class="dots" id="progress"></div></section></body></html>
