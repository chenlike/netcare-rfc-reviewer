[package]
name = "rfc-review-studio"
version = "1.2.0"
edition = "2021"
description = "Independent RFC review desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
